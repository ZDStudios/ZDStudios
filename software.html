<!DOCTYPE html>

<style>
  /* Catppuccin Mocha */
  :root {
    --crust: #11111b;
    --mantle: #181825;
    --base: #1e1e2e;
    --surface0: #313244;
    --surface1: #45475a;
    --overlay0: #6c7086;
    --subtext: #a6adc8;
    --text: #cdd6f4;
    --mauve: #cba6f7;
    --green: #a6e3a1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--base);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a:focus-visible {
    outline: 2px solid var(--mauve);
    outline-offset: 3px;
    border-radius: 6px;
  }

  header {
    background: var(--mantle);
    border-bottom: 1px solid var(--surface0);
  }
  .bar {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand { font-weight: 700; color: var(--text); text-decoration: none; }
  .bar nav a { color: var(--subtext); text-decoration: none; font-size: 15px; }
  .bar nav a:hover { color: var(--text); }

  main {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px;
  }

  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
  .intro { color: var(--subtext); margin: 6px 0 32px; }

  .app {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--surface0);
    border-radius: 14px;
    padding: 20px;
  }
  .app + .app { margin-top: 12px; }
  .app.green { --accent: var(--green); }

  .app-icon {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--accent, var(--mauve));
    color: var(--crust);
    display: grid;
    place-items: center;
  }
  .app-icon svg { width: 30px; height: 30px; }

  .app-info { flex: 1; min-width: 0; }
  .app-info h2 { font-size: 1.15rem; font-weight: 600; }
  .app-info p { color: var(--subtext); }
  .app-info .ver { color: var(--overlay0); font-size: 14px; margin-top: 2px; }

  .btn {
    flex: none;
    background: var(--accent, var(--mauve));
    color: var(--crust);
    font-weight: 600;
    text-decoration: none;
    padding: 11px 22px;
    border-radius: 10px;
    transition: filter .12s;
  }
  .btn:hover { filter: brightness(1.1); }

  footer {
    text-align: center;
    color: var(--overlay0);
    font-size: 14px;
    padding: 28px 24px;
    border-top: 1px solid var(--surface0);
  }

  @media (max-width: 560px) {
    main { padding-top: 40px; }
    .app { flex-wrap: wrap; }
    .app-info { flex-basis: calc(100% - 76px); }
    .btn { width: 100%; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
